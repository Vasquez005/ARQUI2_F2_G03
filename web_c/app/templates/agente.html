{% extends "base.html" %}
{% block content %}
<h1>Interfaz AGENTE</h1>
<div id="agente-root" class="rol-root">
  <section class="panel">
    <div class="tabs">
      <button type="button" class="tab tab-btn active" data-tab="declaraciones">Declaraciones</button>
      <button type="button" class="tab tab-btn" data-tab="seguimiento">Seguimiento</button>
    </div>
  </section>

  <section class="panel tab-panel" data-tab-panel="declaraciones">
    <div class="sin-header">
      <h2>Manifiestos sin levante</h2>
      <button type="button" id="agente-refresh">Actualizar</button>
    </div>
    <p id="agente-result" class="resultado"></p>
    <div class="table-wrap"><table id="agente-table-pendientes" class="data-table"></table></div>
  </section>

  <section class="panel tab-panel hidden" data-tab-panel="seguimiento">
    <h2>Seguimiento de mis solicitudes</h2>
    <form id="agente-filtros" class="filtros">
      <label>Numero de declaracion <input name="q" placeholder="DECL-..." /></label>
      <label>Estado
        <select name="estado">
          <option value="">Todas</option>
          <option value="pendiente">Pendientes</option>
          <option value="autorizada">Autorizadas</option>
          <option value="retenida">Retenidas</option>
        </select>
      </label>
      <button type="submit">Buscar</button>
    </form>
    <div class="table-wrap"><table id="agente-table-seguimiento" class="data-table"></table></div>
  </section>
</div>

<dialog id="dlg-declaracion" class="dialogo">
  <form method="dialog"><button class="cerrar" aria-label="Cerrar">&times;</button></form>
  <h2 id="dlg-declaracion-titulo">Presentar declaracion</h2>
  <form id="agente-form-declaracion" class="grid-form">
    <label>Numero de declaracion <input name="numero_declaracion" required placeholder="DECL-2026-001" /></label>
    <label>Regimen
      <select name="regimen" required>
        <option value="importacion_definitiva">Importacion definitiva</option>
        <option value="deposito_temporal">Deposito temporal</option>
      </select>
    </label>
    <label>Valor declarado <input name="valor_declarado" type="number" min="0.01" step="0.01" required /></label>
    <label class="full-width">Descripcion de la mercancia (minimo 10 caracteres)
      <input name="descripcion" required minlength="10" />
    </label>
    <div class="form-actions"><button type="submit">Presentar declaracion</button></div>
  </form>
</dialog>
<script src="/static/roles.js?v={{ v }}"></script>
{% endblock %}
