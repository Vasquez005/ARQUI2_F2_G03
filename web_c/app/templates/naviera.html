{% extends "base.html" %}
{% block content %}
<h1>Interfaz NAVIERA</h1>
<div id="naviera-root" class="rol-root">
  <section class="panel">
    <div class="tabs">
      <button type="button" class="tab tab-btn active" data-tab="manifiestos">Manifiestos</button>
      <button type="button" class="tab tab-btn" data-tab="contenedores">Mis contenedores</button>
    </div>
  </section>

  <section class="panel tab-panel" data-tab-panel="manifiestos">
    <div class="sin-header">
      <h2>Manifiestos</h2>
      <button type="button" id="naviera-nuevo">Nuevo manifiesto</button>
    </div>
    <form id="naviera-form-manifiesto" class="grid-form hidden">
      <label>Contenedor (catalogo de la maqueta)
        <input id="naviera-contenedor" list="naviera-catalogo" required placeholder="MSCU0000001" />
        <datalist id="naviera-catalogo"></datalist>
      </label>
      <label>Tipo de operacion
        <select id="naviera-operacion" required>
          <option value="DEPOSITO">Deposito</option>
          <option value="RETIRO">Retiro</option>
        </select>
      </label>
      <label>Peso declarado (g)
        <input id="naviera-peso" type="number" min="1" step="1" required />
      </label>
      <label>Tolerancia (%) <small class="muted">si se deja vacia, 5 %</small>
        <input id="naviera-tolerancia" type="number" min="0" step="0.1" placeholder="5" />
      </label>
      <label>Transportista asignado
        <select id="naviera-transportista" required></select>
      </label>
      <label>Tarjeta RFID del vehiculo <small class="muted">opcional</small>
        <input id="naviera-rfid" placeholder="E1 69 73 15" />
      </label>
      <label class="full-width">Observaciones
        <input id="naviera-observaciones" placeholder="Opcional" />
      </label>
      <div class="form-actions">
        <button type="submit">Declarar manifiesto</button>
        <button type="button" id="naviera-cancelar">Cancelar</button>
      </div>
    </form>
    <p id="naviera-result" class="resultado"></p>
    <div class="table-wrap"><table id="naviera-table-manifiestos" class="data-table"></table></div>
  </section>

  <section class="panel tab-panel hidden" data-tab-panel="contenedores">
    <h2>Mis contenedores</h2>
    <form id="naviera-filtros" class="filtros">
      <label>Contenedor <input name="q" placeholder="MSCU..." /></label>
      <label>Estado
        <select name="estado_documental">
          <option value="">Todos</option>
          <option value="declarado">Declarado</option>
          <option value="declaracion_presentada">Declaracion presentada</option>
          <option value="levante_solicitado">Levante solicitado</option>
          <option value="levante_otorgado">Levante otorgado</option>
          <option value="levante_retenido">Levante retenido</option>
        </select>
      </label>
      <button type="submit">Buscar</button>
    </form>
    <div class="table-wrap"><table id="naviera-table-contenedores" class="data-table"></table></div>
  </section>
</div>

<dialog id="dlg-rol" class="dialogo">
  <form method="dialog"><button class="cerrar" aria-label="Cerrar">&times;</button></form>
  <div id="dlg-rol-body"></div>
</dialog>
<script src="/static/roles.js?v={{ v }}"></script>
{% endblock %}
