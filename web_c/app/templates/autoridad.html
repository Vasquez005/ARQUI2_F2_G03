{% extends "base.html" %}
{% block content %}
<h1>Interfaz AUTORIDAD</h1>
<div id="autoridad-root" class="rol-root">
  <section class="panel">
    <div class="tabs">
      <button type="button" class="tab tab-btn active" data-tab="solicitudes">Solicitudes de levante</button>
      <button type="button" class="tab tab-btn" data-tab="retenciones">Retenciones aduaneras</button>
      <button type="button" class="tab tab-btn" data-tab="carga">Consulta de carga</button>
    </div>
  </section>

  <section class="panel tab-panel" data-tab-panel="solicitudes">
    <div class="sin-header">
      <h2>Solicitudes de levante pendientes</h2>
      <button type="button" id="autoridad-refresh-solicitudes">Actualizar</button>
    </div>
    <p id="autoridad-result" class="resultado"></p>
    <div class="table-wrap"><table id="autoridad-table-solicitudes" class="data-table"></table></div>
  </section>

  <section class="panel tab-panel hidden" data-tab-panel="retenciones">
    <div class="sin-header">
      <h2>Retenciones aduaneras (RT03 canal rojo, RT05 documental)</h2>
      <div class="filtros">
        <label>Estado
          <select id="autoridad-ret-estado">
            <option value="abierta">Abiertas</option>
            <option value="resuelta">Resueltas</option>
            <option value="">Todas</option>
          </select>
        </label>
        <button type="button" id="autoridad-refresh-retenciones">Actualizar</button>
      </div>
    </div>
    <div class="table-wrap"><table id="autoridad-table-retenciones" class="data-table"></table></div>
  </section>

  <section class="panel tab-panel hidden" data-tab-panel="carga">
    <h2>Consulta de carga</h2>
    <form id="autoridad-filtros" class="filtros">
      <label>Contenedor <input name="q" placeholder="MSCU..." /></label>
      <label>Naviera <input name="naviera" placeholder="Naviera Uno" /></label>
      <label>Autorizacion
        <select name="estado_documental">
          <option value="">Todas</option>
          <option value="declarado">Declarado</option>
          <option value="declaracion_presentada">Declaracion presentada</option>
          <option value="levante_solicitado">Levante solicitado</option>
          <option value="levante_otorgado">Levante otorgado</option>
          <option value="levante_retenido">Levante retenido</option>
        </select>
      </label>
      <button type="submit">Buscar</button>
    </form>
    <div class="table-wrap"><table id="autoridad-table-carga" class="data-table"></table></div>
  </section>
</div>

<dialog id="dlg-rol" class="dialogo">
  <form method="dialog"><button class="cerrar" aria-label="Cerrar">&times;</button></form>
  <div id="dlg-rol-body"></div>
</dialog>
<script src="/static/roles.js?v={{ v }}"></script>
{% endblock %}
